
services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: sorting_desk
      MYSQL_USER: waste
      MYSQL_PASSWORD: waste_pw
      MYSQL_ROOT_PASSWORD: root_pw
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pw"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - path: .env
        required: false
    environment:
            DATABASE_URL: mysql+pymysql://waste:waste_pw@db:3306/sorting_desk
    volumes:
      - models:/models
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  models:
