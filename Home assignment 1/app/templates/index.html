<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waste Sorting Assistant · {{ region }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
  <header>
    <h1>♻️ Waste Sorting Assistant</h1>
    <p>Region: <strong>{{ region }}</strong> · Snap or upload a photo to learn where it belongs.</p>
  </header>

  <section class="card scan">
    <div class="actions">
      <button id="camera-btn" class="primary">📷 Take photo</button>
      <button id="upload-btn">🖼️ Upload photo</button>
      <input id="file-input" type="file" accept="image/*" hidden>
      <input id="capture-input" type="file" accept="image/*" capture="environment" hidden>
    </div>
    <div id="camera-panel" hidden>
      <video id="video" autoplay playsinline muted></video>
      <div class="actions">
        <button id="snap-btn" class="primary">Capture</button>
        <button id="cancel-btn">Cancel</button>
      </div>
    </div>
    <div class="preview-row">
      <img id="preview" alt="" hidden>
      <div id="result" aria-live="polite"></div>
    </div>
  </section>

  <section class="kpis">
    <div class="card kpi"><span id="kpi-total">0</span><small>Items scanned</small></div>
    <div class="card kpi"><span id="kpi-rate">0%</span><small>Recyclable</small></div>
    <div class="card kpi"><span id="kpi-conf">0%</span><small>Avg. confidence</small></div>
  </section>

  <section class="charts">
    <div class="card"><h2>Materials</h2>
      <div class="chart-box"><canvas id="chart-materials"></canvas></div></div>
    <div class="card"><h2>Bins used</h2>
      <div class="chart-box"><canvas id="chart-bins"></canvas></div></div>
    <div class="card wide"><h2>Scans per day</h2>
      <div class="chart-box"><canvas id="chart-trend"></canvas></div></div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
